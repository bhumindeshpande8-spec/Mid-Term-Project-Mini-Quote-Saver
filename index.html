<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Quote Saver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quote Saver</h1>
        <div class="input-group">
            <input type="text" id="quoteInput" placeholder="Enter a quote..." maxlength="100">
            <button id="addBtn">Add Quote</button>
        </div>
        <ul id="quoteList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
